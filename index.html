<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Dorm Manager - บ้านพลอยระย้า</title>

<style>

:root{
    --orange:#ff7a00;
    --orange2:#ff9b3f;
    --orange-soft:#fff1e5;
    --bg:#f5f6f8;
    --text:#202124;
    --muted:#8b8d93;
    --green:#22a45d;
    --green-soft:#e8f8ef;
    --yellow:#c78300;
    --yellow-soft:#fff4d9;
    --red:#df4d4d;
    --red-soft:#fff0f0;
    --blue:#4778e8;
    --blue-soft:#edf2ff;
    --border:#ececef;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

    background:#dedede;
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================
   PHONE
========================================= */

.phone{
    width:100%;
    max-width:430px;
    min-height:100dvh;
    margin:auto;
    background:var(--bg);
    position:relative;

    /*
       สำคัญ:
       ห้ามใช้ overflow:hidden กับ phone
       เพราะจะทำให้หน้าเว็บเลื่อนยาก
    */
    overflow-x:hidden;
}

@media(min-width:600px){

    body{
        padding:20px;
    }

    .phone{
        min-height:900px;
        height:900px;
        border-radius:38px;
        box-shadow:0 20px 70px rgba(0,0,0,.20);

        /*
           ให้หน้าจอภายในเลื่อนได้
        */
        overflow-y:auto;
    }
}


/* =========================================
   COMMON
========================================= */

.screen{
    min-height:100dvh;
    padding-bottom:105px;
}

.btn{
    border:0;
    border-radius:16px;
    padding:13px 16px;
    font-weight:700;
}

.btn-primary{
    background:var(--orange);
    color:white;
}

.btn-light{
    background:var(--orange-soft);
    color:var(--orange);
}

.btn-green{
    background:var(--green-soft);
    color:var(--green);
}

.btn-blue{
    background:var(--blue-soft);
    color:var(--blue);
}

.btn-red{
    background:var(--red-soft);
    color:var(--red);
}

.btn-white{
    background:white;
    border:1px solid var(--border);
    color:var(--text);
}

.card{
    background:white;
    border-radius:22px;
    border:1px solid var(--border);
    padding:17px;
    box-shadow:0 5px 20px rgba(0,0,0,.03);
}


/* =========================================
   LOGIN
========================================= */

.login-screen{
    min-height:100dvh;
    padding:28px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;

    background:
        linear-gradient(
            160deg,
            #ff7600 0%,
            #ff9d3f 45%,
            #fff2e6 45%,
            #fff 100%
        );
}

.login-brand{
    color:white;
    margin-bottom:45px;
}

.logo{
    width:76px;
    height:76px;
    border-radius:25px;
    background:white;
    display:grid;
    place-items:center;
    font-size:38px;
    margin-bottom:15px;
    box-shadow:0 12px 25px rgba(120,55,0,.17);
}

.login-brand h1{
    font-size:29px;
}

.login-brand p{
    opacity:.9;
    margin-top:4px;
}

.login-card{
    background:white;
    border-radius:28px;
    padding:24px;
    box-shadow:0 18px 45px rgba(0,0,0,.10);
}

.login-card h2{
    margin-bottom:5px;
}

.login-card > p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:22px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.input{
    width:100%;
    border:1px solid #e3e3e7;
    background:#fafafa;
    padding:14px;
    border-radius:15px;
    outline:none;
}

.input:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,122,0,.1);
}

.login-button{
    width:100%;
    margin-top:5px;
    padding:15px;
    border-radius:16px;
    border:0;
    color:white;
    background:linear-gradient(
        135deg,
        var(--orange),
        var(--orange2)
    );
    font-weight:800;
}

.demo{
    margin-top:18px;
    background:#fafafa;
    border-radius:15px;
    padding:12px;
    color:#777;
    font-size:12px;
    line-height:1.7;
}


/* =========================================
   HEADER
========================================= */

.header{
    background:
        linear-gradient(
            135deg,
            var(--orange),
            var(--orange2)
        );

    color:white;

    padding:
        calc(18px + env(safe-area-inset-top))
        18px
        25px;

    border-radius:0 0 30px 30px;
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header small{
    opacity:.85;
}

.header h1{
    font-size:23px;
    margin-top:3px;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,.22);
    display:grid;
    place-items:center;
    font-size:21px;
}

.logout{
    margin-top:18px;
    background:rgba(255,255,255,.15);
    color:white;
    border:1px solid rgba(255,255,255,.25);
    padding:9px 13px;
    border-radius:14px;
}


/* =========================================
   CONTENT
========================================= */

.content{
    padding:18px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:22px 0 12px;
}

.section-title h2{
    font-size:18px;
}

.section-title span{
    color:var(--orange);
    font-size:13px;
}


/* =========================================
   DASHBOARD
========================================= */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.stat-card{
    background:white;
    border-radius:20px;
    padding:15px;
    border:1px solid var(--border);
}

.stat-icon{
    font-size:24px;
    margin-bottom:8px;
}

.stat-number{
    font-size:22px;
    font-weight:900;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
}


/* =========================================
   DASHBOARD MENU
========================================= */

.dashboard-menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.dashboard-button{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px 12px;
    text-align:left;
}

.dashboard-button .big-icon{
    font-size:28px;
    margin-bottom:8px;
}

.dashboard-button b{
    display:block;
    font-size:14px;
}

.dashboard-button small{
    color:var(--muted);
    display:block;
    margin-top:3px;
}


/* =========================================
   ANNOUNCEMENT
========================================= */

.announcement{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:15px;
    margin-bottom:11px;
}

.announcement.warning{
    border-left:5px solid var(--orange);
}

.announcement-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:800;
}

.announcement-date{
    color:var(--orange);
    font-size:12px;
    margin-top:6px;
}

.announcement-detail{
    font-size:13px;
    color:#666;
    margin-top:8px;
    line-height:1.6;
}


/* =========================================
   ROOM
========================================= */

.room-list{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.room-card{
    background:white;
    padding:16px;
    border-radius:22px;
    border:1px solid var(--border);
}

.room-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.room-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.room-icon{
    width:48px;
    height:48px;
    border-radius:16px;
    background:var(--orange-soft);
    display:grid;
    place-items:center;
    font-size:24px;
}

.room-name{
    font-size:18px;
    font-weight:800;
}

.tenant-name{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
}

.badge{
    padding:6px 9px;
    border-radius:30px;
    font-size:11px;
    font-weight:700;
}

.badge-paid{
    background:var(--green-soft);
    color:var(--green);
}

.badge-pending{
    background:var(--yellow-soft);
    color:var(--yellow);
}

.cost-box{
    background:#fafafa;
    border-radius:17px;
    padding:12px;
    margin-top:13px;
}

.cost-row{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
    font-size:13px;
}

.cost-total{
    display:flex;
    justify-content:space-between;
    border-top:1px dashed #ddd;
    padding-top:10px;
    margin-top:10px;
    font-weight:900;
}

.cost-total strong{
    color:var(--orange);
}

.room-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}


/* =========================================
   REPAIR
========================================= */

.repair-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid #f0f0f0;
}

.repair-item:last-child{
    border-bottom:0;
}

.repair-icon{
    width:45px;
    height:45px;
    border-radius:15px;
    background:#eef3ff;
    display:grid;
    place-items:center;
    flex-shrink:0;
}

.repair-status{
    font-size:11px;
    margin-top:5px;
    color:var(--orange);
}


/* =========================================
   QUICK
========================================= */

.quick-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.quick-button{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px 6px;
    text-align:center;
}

.quick-button .icon{
    width:42px;
    height:42px;
    background:var(--orange-soft);
    border-radius:14px;
    display:grid;
    place-items:center;
    margin:auto auto 7px;
    font-size:20px;
}

.quick-button span{
    font-size:11px;
    font-weight:700;
}


/* =========================================
   INFO
========================================= */

.info-card{
    background:white;
    border:1px solid var(--border);
    border-radius:22px;
    padding:16px;
    margin-bottom:13px;
}

.info-card h3{
    font-size:16px;
    margin-bottom:12px;
}


/* =========================================
   TENANT BALANCE
========================================= */

.tenant-balance{
    color:white;
    background:
        linear-gradient(
            135deg,
            #28282b,
            #44444a
        );

    border-radius:25px;
    padding:21px;
    margin-top:-5px;
    box-shadow:0 15px 30px rgba(0,0,0,.14);
}

.tenant-balance small{
    opacity:.75;
}

.balance-value{
    font-size:35px;
    font-weight:900;
    margin:5px 0 7px;
}

.balance-status{
    display:inline-block;
    padding:6px 10px;
    border-radius:30px;
    background:rgba(255,255,255,.13);
    font-size:12px;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
    position:fixed;
    bottom:0;

    width:100%;
    max-width:430px;

    height:
        calc(75px + env(safe-area-inset-bottom));

    background:rgba(255,255,255,.98);
    border-top:1px solid #eee;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    padding:
        8px
        6px
        env(safe-area-inset-bottom);

    z-index:20;
}

.nav-btn{
    border:0;
    background:none;
    color:#9a9aa0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;

    font-size:10px;
}

.nav-btn .icon{
    font-size:21px;
}

.nav-btn.active{
    color:var(--orange);
}


/* =========================================
   MODAL
========================================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;

    background:rgba(0,0,0,.45);

    display:none;
    align-items:flex-end;
}

.overlay.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:430px;
    margin:auto;

    background:white;

    border-radius:29px 29px 0 0;

    padding:13px 19px 30px;

    max-height:88dvh;

    overflow-y:auto;

    animation:up .25s ease;
}

@keyframes up{
    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }
}

.handle{
    width:43px;
    height:5px;
    background:#ddd;
    border-radius:20px;
    margin:0 auto 17px;
}

.sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.sheet-head h2{
    font-size:19px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#f0f0f0;
}

.sheet-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:17px;
}

.calculation{
    background:var(--orange-soft);
    border-radius:18px;
    padding:15px;
    margin-top:12px;
}

.calculation strong{
    display:block;
    font-size:27px;
    color:var(--orange);
    margin-top:4px;
}


/* =========================================
   BILL
========================================= */

.bill{
    border:1px solid #eee;
    border-radius:20px;
    padding:17px;
}

.bill-title{
    text-align:center;
    margin-bottom:20px;
}

.bill-title h2{
    color:var(--orange);
}

.bill-row{
    display:flex;
    justify-content:space-between;
    margin:9px 0;
    font-size:14px;
}

.bill-total{
    display:flex;
    justify-content:space-between;
    border-top:2px solid #222;
    padding-top:12px;
    margin-top:12px;
    font-size:19px;
    font-weight:900;
}


/* =========================================
   TOAST
========================================= */

.toast{
    position:fixed;
    bottom:95px;
    left:50%;

    transform:translate(-50%,20px);

    background:#252525;
    color:white;

    padding:11px 16px;

    border-radius:40px;

    font-size:12px;

    opacity:0;
    pointer-events:none;

    transition:.2s;

    z-index:300;

    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================================
   EMPTY
========================================= */

.empty{
    text-align:center;
    color:#999;
    padding:25px 10px;
}


/* =========================================
   PRINT
========================================= */

@media print{

    body{
        background:white;
    }

    .phone{
        max-width:none;
        box-shadow:none;
    }

    .bottom-nav,
    .header,
    .overlay{
        display:none !important;
    }

}

</style>
</head>


<body>


<div class="phone">


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen" class="login-screen">

    <div class="login-brand">

        <div class="logo">
            🏠
        </div>

        <h1>
            บ้านพลอยระย้า
        </h1>

        <p>
            Dorm Manager
        </p>

    </div>


    <div class="login-card">

        <h2>
            เข้าสู่ระบบ
        </h2>

        <p>
            สำหรับผู้ดูแลและผู้เช่าห้องพัก
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    Username / เลขห้อง
                </label>

                <input
                    id="username"
                    class="input"
                    placeholder="เช่น admin หรือ 205"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    class="input"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                class="login-button"
                type="submit">

                เข้าสู่ระบบ

            </button>

        </form>


        <div class="demo">

            <b>บัญชีทดสอบ</b><br>

            Admin:
            <b>admin / 1234</b>

            <br>

            ผู้เช่า:
            <b>205 / 2050</b>

            <br>

            ห้องอื่นใช้เลขห้อง + 0
            เช่น 201 / 2010

        </div>

    </div>

</section>



<!-- =====================================================
     ADMIN
===================================================== -->

<section
    id="adminScreen"
    class="screen hidden">


    <header class="header">

        <div class="header-row">

            <div>

                <small>
                    สวัสดี 👋
                </small>

                <h1>
                    Admin Dashboard
                </h1>

            </div>

            <div class="avatar">
                👩🏻‍💼
            </div>

        </div>


        <button
            class="logout"
            onclick="logout()">

            🚪 ออกจากระบบ

        </button>

    </header>


    <main
        id="adminContent"
        class="content">
    </main>


    <nav class="bottom-nav">

        <button
            class="nav-btn active"
            onclick="showAdminPage('home',this)">

            <div class="icon">
                🏠
            </div>

            หน้าหลัก

        </button>


        <button
            class="nav-btn"
            onclick="showAdminPage('rooms',this)">

            <div class="icon">
                🛏️
            </div>

            ห้องพัก

        </button>


        <button
            class="nav-btn"
            onclick="showAdminPage('bills',this)">

            <div class="icon">
                🧾
            </div>

            บิล

        </button>


        <button
            class="nav-btn"
            onclick="showAdminPage('profile',this)">

            <div class="icon">
                👤
            </div>

            บัญชี

        </button>

    </nav>

</section>



<!-- =====================================================
     TENANT
===================================================== -->

<section
    id="tenantScreen"
    class="screen hidden">


    <header class="header">

        <div class="header-row">

            <div>

                <small id="tenantHello">
                    สวัสดี
                </small>

                <h1 id="tenantRoomTitle">
                    ห้อง
                </h1>

            </div>

            <div class="avatar">
                👤
            </div>

        </div>

    </header>


    <main
        id="tenantContent"
        class="content">
    </main>


    <nav class="bottom-nav">

        <button
            class="nav-btn active"
            onclick="showTenantPage('home',this)">

            <div class="icon">
                🏠
            </div>

            หน้าหลัก

        </button>


        <button
            class="nav-btn"
            onclick="showTenantPage('bill',this)">

            <div class="icon">
                🧾
            </div>

            บิล

        </button>


        <button
            class="nav-btn"
            onclick="showTenantPage('repair',this)">

            <div class="icon">
                🔧
            </div>

            แจ้งซ่อม

        </button>


        <button
            class="nav-btn"
            onclick="showTenantPage('profile',this)">

            <div class="icon">
                👤
            </div>

            บัญชี

        </button>

    </nav>

</section>



<!-- =====================================================
     ELECTRIC SHEET
===================================================== -->

<div
    id="electricSheet"
    class="overlay">

    <div class="sheet">

        <div class="handle"></div>

        <div class="sheet-head">

            <h2>
                ⚡ กรอกมิเตอร์ไฟ
            </h2>

            <button
                class="close"
                onclick="closeSheet('electricSheet')">

                ✕

            </button>

        </div>


        <div class="form-group">

            <label>
                ห้อง
            </label>

            <input
                id="electricRoom"
                class="input"
                readonly>

        </div>


        <div class="form-group">

            <label>
                มิเตอร์เดิม
            </label>

            <input
                id="oldMeter"
                class="input"
                type="number"
                readonly>

        </div>


        <div class="form-group">

            <label>
                มิเตอร์ปัจจุบัน
            </label>

            <input
                id="newMeter"
                class="input"
                type="number"
                oninput="calculateElectric()">

        </div>


        <div class="form-group">

            <label>
                ค่าไฟต่อหน่วย
            </label>

            <input
                id="electricRate"
                class="input"
                type="number"
                value="7"
                oninput="calculateElectric()">

        </div>


        <div class="calculation">

            ใช้ไฟ

            <b id="unitResult">
                0 หน่วย
            </b>

            <strong id="priceResult">
                ฿0
            </strong>

        </div>


        <div class="sheet-actions">

const roomNumbers = [

const tenantNames = {

    "202":"ภูมิพัฒน์",
    "203":"พิมพ์ชนก",
    "204":"กิตติ",

    "301":"ศุภชัย",
    "302":"อรทัย",
    "303":"ณัฐวุฒิ",
    "304":"แพรวา",
    "305":"ภัทรพล",
    "306":"สุภาวดี"

};


function createDefaultRooms(){

    return roomNumbers.map(
        (room,index)=>({

            room:room,

            tenant:
                tenantNames[room]
                || "ยังไม่มีผู้เช่า",

            rent:2800,

            water:100,

            oldMeter:
                1000 + (index * 100),

            newMeter:
                1000 + (index * 100) + 50,

            rate:7,

            status:
                index === 0
                ? "paid"
                : "pending"

        })
    );

}


/* =====================================================
   DATA
===================================================== */

let rooms =
    JSON.parse(
        localStorage.getItem(
            "mobileDormRooms"
        )
    )
    || createDefaultRooms();


/*
   ป้องกันกรณี LocalStorage
   เคยเก็บข้อมูลเก่าที่มีแค่ 4 ห้อง
   ให้เติมห้องที่เหลือให้ครบ 12 ห้อง
*/

roomNumbers.forEach(
    roomNumber=>{

        if(
            !rooms.some(
                r =>
                    r.room === roomNumber
            )
        ){

            const index =
                roomNumbers.indexOf(
                    roomNumber
                );

            rooms.push({

                room:roomNumber,

                tenant:
                    tenantNames[roomNumber]
                    || "ยังไม่มีผู้เช่า",

                rent:2800,

                water:100,

                oldMeter:
                    1000 + index * 100,

                newMeter:
                    1050 + index * 100,

                rate:7,

                status:"pending"

            });

        }

    }
);


/*
   บังคับค่าเช่า/น้ำ/ไฟ
   ตามที่กำหนด
*/

rooms.forEach(
    room=>{

        room.rent = 2800;
        room.water = 100;
        room.rate = 7;

    }
);


let repairs =
    JSON.parse(
        localStorage.getItem(
            "mobileDormRepairs"
        )
    )
    || [];


let announcements =
    JSON.parse(
        localStorage.getItem(
            "mobileDormAnnouncements"
        )
    )
    || [];


let currentUser = null;

let selectedRoom = null;


/* =====================================================
   HELPER
===================================================== */

function money(value){

    return "฿" +
        Number(value || 0)
        .toLocaleString("th-TH");

}


function units(room){

    return Math.max(
        0,
        Number(room.newMeter || 0) -
        Number(room.oldMeter || 0)
    );

}


function electric(room){

    return units(room) *
        Number(room.rate || 7);

}


function total(room){

    return Number(room.rent || 2800) +
        Number(room.water || 100) +
        electric(room);

}


function saveData(){

    localStorage.setItem(
        "mobileDormRooms",
        JSON.stringify(rooms)
    );

    localStorage.setItem(
        "mobileDormRepairs",
        JSON.stringify(repairs)
    );

    localStorage.setItem(
        "mobileDormAnnouncements",
        JSON.stringify(announcements)
    );

}


function toast(text){

    const el =
        document.getElementById(
            "toast"
        );

    el.textContent = text;

    el.classList.add("show");

    setTimeout(
        ()=>{
            el.classList.remove("show");
        },
        2200
    );

}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        const username =
            document
            .getElementById("username")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;


        const user =
            users.find(
                u =>
                    u.username === username
                    &&
                    u.password === password
            );


        if(!user){

            toast(
                "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
            );

            return;

        }


        currentUser = user;


        localStorage.setItem(
            "mobileDormUser",
            JSON.stringify(user)
        );


        openApp();

    }
);


/* =====================================================
   OPEN APP
===================================================== */

function openApp(){

    document
    .getElementById("loginScreen")
    .classList.add("hidden");


    if(
        currentUser.role === "admin"
    ){

        document
        .getElementById("adminScreen")
        .classList.remove("hidden");

        document
        .getElementById("tenantScreen")
        .classList.add("hidden");

        renderAdminHome();

    }

    else{

        document
        .getElementById("tenantScreen")
        .classList.remove("hidden");

        document
        .getElementById("adminScreen")
        .classList.add("hidden");

        renderTenantHome();

    }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    currentUser = null;

    localStorage.removeItem(
        "mobileDormUser"
    );


    document
    .getElementById("adminScreen")
    .classList.add("hidden");


    document
    .getElementById("tenantScreen")
    .classList.add("hidden");


    document
    .getElementById("loginScreen")
    .classList.remove("hidden");


    document
    .getElementById("username")
    .value = "";

    document
    .getElementById("password")
    .value = "";

}


/* =====================================================
   CHECK LOGIN
===================================================== */

function checkLogin(){

    const saved =
        localStorage.getItem(
            "mobileDormUser"
        );


    if(!saved){

        return;

    }


    try{

        const user =
            JSON.parse(saved);


        const validUser =
            users.find(
                u =>
                    u.username ===
                    user.username
                    &&
                    u.password ===
                    user.password
            );


        if(validUser){

            currentUser = validUser;

            openApp();

        }

        else{

            localStorage.removeItem(
                "mobileDormUser"
            );

        }

    }

    catch(error){

        localStorage.removeItem(
            "mobileDormUser"
        );

    }

}

/* =====================================================
   ELECTRIC
===================================================== */

function openElectric(index){

    selectedRoom = index;


    const room =
        rooms[index];


    document
    .getElementById("electricRoom")
    .value =
        room.room;


    document
    .getElementById("oldMeter")
    .value =
        room.oldMeter;


    document
    .getElementById("newMeter")
    .value =
        room.newMeter;


    document
    .getElementById("electricRate")
    .value =
        7;


    calculateElectric();

    openSheet(
        "electricSheet"
    );

}


function calculateElectric(){

    const oldValue =
        Number(
            document
            .getElementById("oldMeter")
            .value
        );


    const newValue =
        Number(
            document
            .getElementById("newMeter")
            .value
        );


    const rate =
        7;


    const use =
        Math.max(
            0,
            newValue -
            oldValue
        );


    document
    .getElementById("unitResult")
    .textContent =
        use +
        " หน่วย";


    document
    .getElementById("priceResult")
    .textContent =
        money(
            use * rate
        );

}


function saveElectric(){

    const room =
        rooms[selectedRoom];


    const newValue =
        Number(
            document
            .getElementById("newMeter")
            .value
        );


    if(
        newValue <
        room.oldMeter
    ){

        toast(
            "มิเตอร์ใหม่ต้องมากกว่ามิเตอร์เดิม"
        );

        return;

    }


    room.newMeter =
        newValue;


    room.rate = 7;


    saveData();


    closeSheet(
        "electricSheet"
    );


    renderAdminRooms();


    toast(
        "บันทึกมิเตอร์แล้ว"
    );

}

/* =====================================================
   ANNOUNCEMENT HTML
===================================================== */

function announcementHTML(item){

    const date =
        formatDate(item.date);


    return `

        <div class="announcement warning">

            <div class="announcement-title">

                📢

                <span>
                    ${item.title}
                </span>

            </div>


            <div class="announcement-date">

                📅 ${date}

                &nbsp;

                🕐 ${item.start}
                -
                ${item.end}

            </div>


            <div class="announcement-detail">

                ${item.detail}

            </div>

        </div>

    `;

}


function formatDate(date){

    if(!date) return "";


    const parts =
        date.split("-");


    if(parts.length !== 3){

        return date;

    }


    return (
        Number(parts[2]) +
        "/" +
        Number(parts[1]) +
        "/" +
        parts[0]
    );

}


/* =====================================================
   SHEET
===================================================== */

function openSheet(id){

    const el =
        document.getElementById(id);


    if(el){

        el.classList.add("show");

    }

}


function closeSheet(id){

    const el =
        document.getElementById(id);


    if(el){

        el.classList.remove("show");

    }

}


/* =====================================================
   CLOSE MODAL BY CLICK OUTSIDE
===================================================== */

document
.querySelectorAll(".overlay")
.forEach(
    overlay=>{

        overlay.addEventListener(
            "click",
            event=>{

                if(
                    event.target === overlay
                ){

                    overlay.classList.remove(
                        "show"
                    );

                }

            }
        );

    }
);


/* =====================================================
   ESC CLOSE
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Escape"){

            document
            .querySelectorAll(".overlay.show")
            .forEach(
                el =>
                    el.classList.remove(
                        "show"
                    )
            );

        }

    }
);
