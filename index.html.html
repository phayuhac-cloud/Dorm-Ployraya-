<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorm Manager - บ้านพลอยระย้า</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff7f0;
    color:#333;
}

.app{
    max-width:500px;
    margin:auto;
    min-height:100vh;
    background:#fff;
    padding-bottom:90px;
}

/* HEADER */
.header{
    background:#ff8c42;
    color:white;
    padding:20px;
    border-radius:0 0 25px 25px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:45px;
    height:45px;
    background:white;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.logo h2{
    margin:0;
}

.logo small{
    opacity:.9;
}

.notification{
    border:0;
    background:white;
    border-radius:12px;
    padding:10px;
    font-size:20px;
    cursor:pointer;
}

.greeting{
    margin-top:25px;
}

.greeting p{
    margin:0;
}

.greeting h1{
    margin:5px 0 0;
    font-size:24px;
}

/* PAGE */
.page{
    display:none;
    padding:20px;
}

.page.active{
    display:block;
}

.page-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.page-header h2{
    margin:0;
}

.back{
    border:0;
    background:#fff0e5;
    width:40px;
    height:40px;
    border-radius:12px;
    font-size:28px;
    cursor:pointer;
}

/* BUTTON */
.pay-button,
.save{
    width:100%;
    border:0;
    background:#ff8c42;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

.cancel{
    width:100%;
    border:0;
    background:#eee;
    padding:14px;
    border-radius:12px;
    margin-top:8px;
    cursor:pointer;
}

/* REPAIR CARD */
.repair-card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 12px #ddd;
    border-left:5px solid #ff8c42;
}

.repair-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.repair-room{
    font-size:18px;
    font-weight:bold;
}

.repair-name{
    margin:10px 0;
    font-size:17px;
}

.repair-detail{
    color:#777;
    font-size:14px;
}

.repair-cost{
    background:#fff7f0;
    padding:10px;
    border-radius:10px;
    margin:10px 0;
}

.repair-total{
    font-weight:bold;
    color:#e53935;
}

/* STATUS */
.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pending{
    background:#ffe0e0;
    color:#e53935;
}

.working{
    background:#fff0c2;
    color:#c77700;
}

.done{
    background:#d9f7df;
    color:#16843a;
}

/* ACTION BUTTONS */
.actions{
    display:flex;
    gap:8px;
}

.actions button{
    flex:1;
    border:0;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.work-btn{
    background:#fff0c2;
}

.done-btn{
    background:#d9f7df;
    color:#16843a;
}

.delete-btn{
    background:#ffe0e0;
    color:#e53935;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:450px;
    border-radius:20px;
    padding:20px;
}

.modal-box h2{
    margin-top:0;
}

.input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

/* HISTORY */
.history-card{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:10px;
    box-shadow:0 2px 8px #ddd;
}

.empty{
    text-align:center;
    color:#999;
    padding:40px 10px;
}

/* NAV */
.nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:500px;
    background:white;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-around;
    padding:8px 5px;
}

.nav-btn{
    border:0;
    background:none;
    color:#777;
    font-size:11px;
    cursor:pointer;
}

.nav-icon{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-btn.active{
    color:#ff8c42;
    font-weight:bold;
}

/* SUMMARY */
.summary-box{
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:12px;
    box-shadow:0 2px 8px #ddd;
}

.summary-number{
    font-size:25px;
    font-weight:bold;
}

.orange{
    color:#ff8c42;
}

.red{
    color:#e53935;
}

.green{
    color:#16843a;
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HOME ================= -->

<div id="home" class="page active">

    <div class="header">

        <div class="header-top">

            <div class="logo">

                <div class="logo-icon">🏠</div>

                <div>
                    <h2>บ้านพลอยระย้า</h2>
                    <small>Dorm Manager</small>
                </div>

            </div>

            <button class="notification" onclick="showNotification()">
                🔔
            </button>

        </div>

        <div class="greeting">

            <p>สวัสดี 👋</p>

            <h1>คุณผู้ดูแลหอพัก</h1>

        </div>

    </div>

    <div style="padding:20px">

        <h3>เมนูลัด</h3>

        <button class="pay-button"
                onclick="openPage('repair')">
            🔧 จัดการแจ้งซ่อม
        </button>

        <br><br>

        <h3>ภาพรวมงานซ่อม</h3>

        <div class="summary-box">

            <div>🔴 รอดำเนินการ</div>

            <div class="summary-number red"
                 id="pendingCount">
                0
            </div>

        </div>

        <div class="summary-box">

            <div>🟠 กำลังซ่อม</div>

            <div class="summary-number orange"
                 id="workingCount">
                0
            </div>

        </div>

        <div class="summary-box">

            <div>🟢 ซ่อมเสร็จแล้ว</div>

            <div class="summary-number green"
                 id="doneCount">
                0
            </div>

        </div>

        <div class="summary-box">

            <div>💸 ค่าใช้จ่ายงานซ่อม</div>

            <div class="summary-number red"
                 id="repairCost">
                ฿0
            </div>

        </div>

    </div>

</div>


<!-- ================= REPAIR ================= -->

<div id="repair" class="page">

    <div class="page-header">

        <button class="back"
                onclick="openPage('home')">
            ‹
        </button>

        <h2>🔧 แจ้งซ่อม</h2>

    </div>

    <button class="pay-button"
            onclick="openRepairModal()">
        ＋ เพิ่มรายการแจ้งซ่อม
    </button>

    <br><br>

    <div id="repairList"></div>

</div>


<!-- ================= HISTORY ================= -->

<div id="history" class="page">

    <div class="page-header">

        <button class="back"
                onclick="openPage('home')">
            ‹
        </button>

        <h2>📜 ประวัติการซ่อม</h2>

    </div>

    <div id="historyList"></div>

</div>


<!-- ================= SUMMARY ================= -->

<div id="summary" class="page">

    <div class="page-header">

        <button class="back"
                onclick="openPage('home')">
            ‹
        </button>

        <h2>📊 รายงาน</h2>

    </div>

    <div class="summary-box">

        <div>ค่าใช้จ่ายงานซ่อมทั้งหมด</div>

        <div class="summary-number red"
             id="summaryRepairCost">
            ฿0
        </div>

    </div>

</div>


<!-- ================= MODAL ================= -->

<div id="repairModal" class="modal">

    <div class="modal-box">

        <h2>🔧 เพิ่มรายการซ่อม</h2>

        <select class="input" id="repairRoom">

            <option value="">เลือกห้อง</option>

            <option>201</option>
            <option>202</option>
            <option>203</option>
            <option>204</option>
            <option>205</option>
            <option>206</option>

            <option>301</option>
            <option>302</option>
            <option>303</option>
            <option>304</option>
            <option>305</option>
            <option>306</option>

        </select>

        <input
            class="input"
            id="repairName"
            placeholder="รายการซ่อม เช่น แอร์ไม่เย็น"
        >

        <input
            class="input"
            id="repairDetail"
            placeholder="รายละเอียดเพิ่มเติม"
        >

        <input
            class="input"
            id="repairMaterial"
            type="number"
            min="0"
            placeholder="ค่าอุปกรณ์"
        >

        <input
            class="input"
            id="repairWorker"
            type="number"
            min="0"
            placeholder="ค่าช่าง"
        >

        <button class="save"
                onclick="addRepair()">
            💾 บันทึกรายการ
        </button>

        <button class="cancel"
                onclick="closeRepairModal()">
            ยกเลิก
        </button>

    </div>

</div>


<!-- ================= NAV ================= -->

<div class="nav">

    <button class="nav-btn active"
            onclick="openPage('home',this)">

        <span class="nav-icon">🏠</span>
        หน้าแรก

    </button>

    <button class="nav-btn"
            onclick="openPage('repair',this)">

        <span class="nav-icon">🔧</span>
        แจ้งซ่อม

    </button>

    <button class="nav-btn"
            onclick="openPage('history',this)">

        <span class="nav-icon">📜</span>
        ประวัติ

    </button>

    <button class="nav-btn"
            onclick="openPage('summary',this)">

        <span class="nav-icon">📊</span>
        รายงาน

    </button>

</div>

</div>


<script>

/* ================= DATA ================= */

let repairs =
JSON.parse(localStorage.getItem("repairs")) || [];

let histories =
JSON.parse(localStorage.getItem("repairHistory")) || [];


/* ================= PAGE ================= */

function openPage(page,btn){

    document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

    document.getElementById(page)
    .classList.add("active");

    document.querySelectorAll(".nav-btn")
    .forEach(b => b.classList.remove("active"));

    if(btn){
        btn.classList.add("active");
    }

    renderAll();
}


/* ================= MODAL ================= */

function openRepairModal(){

    document.getElementById("repairModal")
    .classList.add("active");

}

function closeRepairModal(){

    document.getElementById("repairModal")
    .classList.remove("active");

    document.getElementById("repairRoom").value="";
    document.getElementById("repairName").value="";
    document.getElementById("repairDetail").value="";
    document.getElementById("repairMaterial").value="";
    document.getElementById("repairWorker").value="";

}


/* ================= ADD REPAIR ================= */

function addRepair(){

    const room =
        document.getElementById("repairRoom").value;

    const name =
        document.getElementById("repairName").value.trim();

    const detail =
        document.getElementById("repairDetail").value.trim();

    const material =
        Number(document.getElementById("repairMaterial").value) || 0;

    const worker =
        Number(document.getElementById("repairWorker").value) || 0;


    if(!room || !name){

        alert("กรุณาเลือกห้องและกรอกรายการซ่อม");

        return;

    }


    const repair = {

        id:Date.now(),

        room:room,

        name:name,

        detail:detail,

        material:material,

        worker:worker,

        total:material + worker,

        status:"pending",

        date:new Date().toLocaleDateString("th-TH")

    };


    repairs.push(repair);

    saveData();

    closeRepairModal();

    renderAll();

    openPage("repair");

}


/* ================= CHANGE STATUS ================= */

function changeStatus(id,status){

    const repair =
        repairs.find(r => r.id === id);

    if(!repair) return;

    repair.status = status;

    saveData();

    renderAll();

}


/* ================= CLOSE JOB ================= */

function closeJob(id){

    const index =
        repairs.findIndex(r => r.id === id);

    if(index === -1) return;


    const repair =
        repairs[index];

    repair.status = "done";

    repair.finishedDate =
        new Date().toLocaleDateString("th-TH");


    histories.unshift(repair);

    repairs.splice(index,1);

    saveData();

    renderAll();

    alert("ปิดงานซ่อมเรียบร้อยแล้ว");

}


/* ================= DELETE ================= */

function deleteRepair(id){

    if(!confirm("ต้องการลบรายการนี้ใช่หรือไม่?"))
        return;

    repairs =
        repairs.filter(r => r.id !== id);

    saveData();

    renderAll();

}


/* ================= SAVE ================= */

function saveData(){

    localStorage.setItem(
        "repairs",
        JSON.stringify(repairs)
    );

    localStorage.setItem(
        "repairHistory",
        JSON.stringify(histories)
    );

}


/* ================= RENDER REPAIR ================= */

function renderRepairs(){

    const box =
        document.getElementById("repairList");

    if(repairs.length === 0){

        box.innerHTML =
            `<div class="empty">
                🎉 ไม่มีงานซ่อมค้าง
             </div>`;

        return;

    }


    box.innerHTML =
        repairs.map(r => {

            let statusText="";
            let statusClass="";

            if(r.status==="pending"){

                statusText="🔴 รอดำเนินการ";
                statusClass="pending";

            }

            if(r.status==="working"){

                statusText="🟠 กำลังซ่อม";
                statusClass="working";

            }

            return `

            <div class="repair-card">

                <div class="repair-top">

                    <div class="repair-room">
                        🏠 ห้อง ${r.room}
                    </div>

                    <span class="status ${statusClass}">
                        ${statusText}
                    </span>

                </div>

                <div class="repair-name">
                    🔧 ${r.name}
                </div>

                <div class="repair-detail">
                    ${r.detail || "ไม่มีรายละเอียดเพิ่มเติม"}
                </div>

                <div class="repair-cost">

                    ค่าอุปกรณ์:
                    ฿${r.material.toLocaleString()}

                    <br>

                    ค่าช่าง:
                    ฿${r.worker.toLocaleString()}

                    <hr>

                    <span class="repair-total">
                        ค่าใช้จ่ายรวม:
                        ฿${r.total.toLocaleString()}
                    </span>

                </div>

                <small>
                    📅 แจ้งวันที่ ${r.date}
                </small>

                <br><br>

                <div class="actions">

                    ${
                        r.status==="pending"

                        ?

                        `<button
                            class="work-btn"
                            onclick="changeStatus(${r.id},'working')">
                            🔨 เริ่มซ่อม
                         </button>`

                        :

                        `<button
                            class="done-btn"
                            onclick="closeJob(${r.id})">
                            ✅ ปิดงาน
                         </button>`
                    }

                    <button
                        class="delete-btn"
                        onclick="deleteRepair(${r.id})">
                        🗑️
                    </button>

                </div>

            </div>

            `;

        }).join("");

}


/* ================= HISTORY ================= */

function renderHistory(){

    const box =
        document.getElementById("historyList");


    if(histories.length === 0){

        box.innerHTML =
            `<div class="empty">
                ยังไม่มีประวัติการซ่อม
             </div>`;

        return;

    }


    box.innerHTML =
        histories.map(r => `

        <div class="history-card">

            <strong>
                🔧 ห้อง ${r.room} - ${r.name}
            </strong>

            <p>
                ค่าอุปกรณ์ ฿${r.material.toLocaleString()}
                <br>
                ค่าช่าง ฿${r.worker.toLocaleString()}
                <br>
                <strong>
                    ค่าใช้จ่ายรวม ฿${r.total.toLocaleString()}
                </strong>
            </p>

            <small>
                แจ้ง ${r.date}
                ${
                    r.finishedDate
                    ? " | ปิดงาน " + r.finishedDate
                    : ""
                }
            </small>

            <div style="color:#16843a;margin-top:8px">
                🟢 ซ่อมเสร็จแล้ว
            </div>

        </div>

        `).join("");

}


/* ================= SUMMARY ================= */

function renderSummary(){

    const total =
        histories.reduce(
            (sum,r) => sum + r.total,
            0
        )
        +
        repairs.reduce(
            (sum,r) => sum + r.total,
            0
        );


    document.getElementById("repairCost")
        .textContent =
        "฿" + total.toLocaleString();

    document.getElementById("summaryRepairCost")
        .textContent =
        "฿" + total.toLocaleString();


    document.getElementById("pendingCount")
        .textContent =
        repairs.filter(r =>
            r.status==="pending"
        ).length;


    document.getElementById("workingCount")
        .textContent =
        repairs.filter(r =>
            r.status==="working"
        ).length;


    document.getElementById("doneCount")
        .textContent =
        histories.length;

}


/* ================= NOTIFICATION ================= */

function showNotification(){

    const pending =
        repairs.filter(
            r => r.status !== "done"
        ).length;

    if(pending > 0){

        alert(
            "🔔 มีงานซ่อมที่ยังไม่เสร็จ " +
            pending +
            " รายการ"
        );

    }else{

        alert(
            "🔔 ตอนนี้ไม่มีงานซ่อมค้าง"
        );

    }

}


/* ================= RENDER ALL ================= */

function renderAll(){

    renderRepairs();

    renderHistory();

    renderSummary();

}


/* ================= START ================= */

renderAll();

</script>

</body>
</html>
